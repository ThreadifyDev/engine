ktor:
    application:
        modules:
            - dev.threadify.ApplicationKt.module
    deployment:
        port: 8080
    environment: test
postgres:
  url: "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1"
  user: "root"
  password: ""
queue:
    master:
        host: "localhost"
        port: 6379
        password: "test"
    pool:
        maxSize: 8
        timeout: 500
    ttl:
        default: 7776000
jwt:
    secret: "test-secret-key-for-testing-min-32-characters-long"
    issuer: "threadify-test"
    audience: "threadify-test-users"
    realm: "Threadify Test API"
    expirationMs: 3600000
