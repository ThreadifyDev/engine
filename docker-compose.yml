version: '3.8'
services:
  threadify_storage:
    image: 'postgres:16-alpine'
    ports:
      - '5432'
    environment:
      POSTGRES_USER: '${PS_STORAGE_USER:-td_engine}'
      POSTGRES_PASSWORD: '${PS_STORAGE_PASSWORD:-tdtdtd}'
      POSTGRES_DB: threadify
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks:
      - threadify-network
    volumes:
      - 'threadify-pg16:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${PS_STORAGE_USER:-td_engine}'
      interval: 10s
      timeout: 5s
      retries: 5
  threadify-queue:
    image: 'valkey/valkey:9.0.0'
    ports:
      - '6379:6379'
    volumes:
      - 'threadify-queue:/data'
      - './config/valkey.conf:/etc/valkey/valkey.conf'
    command:
      - valkey-server
      - /etc/valkey/valkey.conf
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - '-a'
        - '${FAST_STORAGE_PASSWORD:-threadify_secure_password}'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  # redis-commander:
  #   image: 'ghcr.io/joeferner/redis-commander:latest'
  #   container_name: redis-commander
  #   ports:
  #     - '8082:8081'
  #   environment:
  #     - 'REDIS_HOSTS=valkey:valkey:6379:0:thread0fy_server'
  #   depends_on:
  #     - threadify-queue
  #   networks:
  #     - threadify-network
  #   restart: unless-stopped
  nats:
    image: 'nats:latest'
    container_name: threadify-nats
    command:
      - '-js'
      - '-sd'
      - /data
      - '-m'
      - '8222'
    volumes:
      - 'nats-data:/data'
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://localhost:8222/healthz'
      interval: 10s
      timeout: 5s
      retries: 5
  threadify-engine:
    image: 'intelijence/th-engine:0.0.2'
    container_name: threadify-engine
    ports:
      - '8081:8081'
      - '6060:6060'
    volumes:
      - './config/:/app/config:ro'
    environment:
      # PostgreSQL configuration (optional - will use default URL if not set)
      - POSTGRES_URL=postgres://${PS_STORAGE_USER:-td_engine}:${PS_STORAGE_PASSWORD:-tdtdtd}@threadify_storage:5432/threadify?sslmode=disable
      
      # Redis configuration (optional - will use defaults if not set)
      - REDIS_HOST=threadify-queue
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${FAST_STORAGE_PASSWORD:-thread0fy_server}
      - REDIS_DB=0
      - REDIS_POOL_SIZE=8
    depends_on:
      threadify_storage:
        condition: service_healthy
      threadify-queue:
        condition: service_healthy
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - '--fail'
        - 'http://localhost:8081/health'
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
  threadify-archiver:
    image: 'intelijence/th-archiver:0.0.2'
    volumes:
      - './config/:/root/config:ro'
    environment:
      # PostgreSQL configuration (optional - will use default URL if not set)
      - POSTGRES_URL=postgres://${PS_STORAGE_USER:-td_engine}:${PS_STORAGE_PASSWORD:-tdtdtd}@threadify_storage:5432/threadify?sslmode=disable
      
      # Redis configuration (optional - will use defaults if not set)
      - REDIS_HOST=threadify-queue
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${FAST_STORAGE_PASSWORD:-thread0fy_server}
      - REDIS_DB=0
      - REDIS_POOL_SIZE=8
    depends_on:
      threadify_storage:
        condition: service_healthy
      threadify-queue:
        condition: service_healthy
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - pgrep
        - '-x'
        - archiver
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
volumes:
  threadify-pg16:
    driver: local
  threadify-queue:
    driver: local
  nats-data:
    driver: local
networks:
  threadify-network:
    driver: bridge
