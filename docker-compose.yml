services:
  threadify_storage:
    image: 'postgres:16-alpine'
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: '${PS_STORAGE_USER:-td_engine}'
      POSTGRES_PASSWORD: '${PS_STORAGE_PASSWORD:-tdtdtd}'
      POSTGRES_DB: threadify
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    networks:
      - threadify-network
    volumes:
      - 'threadify-pg16:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${PS_STORAGE_USER:-td_engine}'
      interval: 10s
      timeout: 5s
      retries: 5
  threadify-queue:
    image: 'valkey/valkey:9.0.0'
    ports:
      - '6379:6379'
    volumes:
      - 'threadify-queue:/data'
      - './config/valkey.conf:/etc/valkey/valkey.conf'
    command:
      - valkey-server
      - /etc/valkey/valkey.conf
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - '-a'
        - '${FAST_STORAGE_PASSWORD:-threadify_secure_password}'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
  # redis-commander:
  #   image: 'ghcr.io/joeferner/redis-commander:latest'
  #   container_name: redis-commander
  #   ports:
  #     - '8082:8081'
  #   environment:
  #     - 'REDIS_HOSTS=valkey:valkey:6379:0:thread0fy_server'
  #   depends_on:
  #     - threadify-queue
  #   networks:
  #     - threadify-network
  #   restart: unless-stopped
  nats:
    image: 'nats:latest'
    container_name: threadify-nats
    ports:
      - '4222:4222'
      - '8222:8222'
    command:
      - '-js'
      - '-sd'
      - /data
      - '-m'
      - '8222'
    volumes:
      - 'nats-data:/data'
    networks:
      - threadify-network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://localhost:8222/healthz'
      interval: 10s
      timeout: 5s
      retries: 5
