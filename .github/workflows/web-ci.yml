name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'threadify-go/Dockerfile.web_ui'
      - '.nvmrc'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'threadify-go/Dockerfile.web_ui'
      - '.nvmrc'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:engine-routing
      - run: npm run test:auth
