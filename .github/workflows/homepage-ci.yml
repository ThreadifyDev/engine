name: Homepage CI

on:
  push:
    branches: [main]
    paths: ['homepage/**', '.nvmrc', '.github/workflows/homepage-ci.yml']
  pull_request:
    paths: ['homepage/**', '.nvmrc', '.github/workflows/homepage-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: homepage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: homepage/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
