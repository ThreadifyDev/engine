name: Engine CI

on:
  pull_request:
    paths:
      - 'threadify-go/**'
      - '!threadify-go/**/README.md'
      - '.github/workflows/engine-*.yml'
      - '.github/actions/setup-engine-go/**'
      - '.github/scripts/*engine*'
      - 'install.sh'
      - 'web/**'
      - 'threadify-agent/**'
      - '.nvmrc'
  # Main/tag pushes are validated by Engine release through this same workflow.
  workflow_call:

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'
  GOFLAGS: '-p=2 -trimpath'

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Test browser routing
        run: |
          npm run typecheck
          npm run test:routes
          npm run test:engine-routing
          npm run test:agent
        working-directory: web
      - name: Build and test static dashboard
        run: npm run test:auth
        working-directory: web
      - name: Stage embedded assets
        run: |
          cp -R web/build/client/. threadify-go/internal/dashboard/dist/
          python3 threadify-go/scripts/check-dashboard.py
      - uses: actions/upload-artifact@v7
        with:
          name: engine-dashboard
          path: threadify-go/internal/dashboard/dist
          if-no-files-found: error
  valkey:
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, target: linux_amd64}
          - {os: macos-14, target: darwin_arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build static Linux Valkey
        if: runner.os == 'Linux'
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/src" -w /src alpine:3.22 sh -c 'apk add --no-cache build-base linux-headers curl && sh threadify-go/scripts/build-valkey.sh threadify-go/bundle/linux_amd64'
      - name: Build native macOS Valkey
        if: runner.os == 'macOS'
        run: sh threadify-go/scripts/build-valkey.sh threadify-go/bundle/darwin_arm64
      - uses: actions/upload-artifact@v7
        with:
          name: valkey-${{ matrix.target }}
          path: threadify-go/bundle
          if-no-files-found: error
  agent-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: linux-amd64}
          - {os: macos-14, target: darwin-arm64}
          - {os: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Usefused/harnest
          ref: 553638d5a12770c0bc9f777b4d10e18a73a19c05
          path: .agent-compiler
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .agent-compiler/go.mod
          cache-dependency-path: .agent-compiler/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          enable-cache: true
          cache-dependency-glob: |
            threadify-agent/harnest-runtime.lock
            threadify-agent/runtime/vendor/*.whl
      - name: Build pinned agent compiler
        run: |
          cp threadify-agent/runtime/vendor/*.whl .agent-compiler/internal/runtimewheel/assets/
          python .agent-compiler/scripts/prepare_uv_assets.py --target '${{ matrix.target }}'
          launcher_target='${{ matrix.target }}'
          launcher_target=${launcher_target//-/_}
          mkdir -p .agent-compiler/internal/agentlauncher/assets
          (cd .agent-compiler && go build -trimpath -ldflags='-s -w' -o "internal/agentlauncher/assets/agent_$launcher_target" ./cmd/harnest-agent)
          mkdir -p "$RUNNER_TEMP/agent-tools"
          executable=harnest
          if [[ "$RUNNER_OS" == Windows ]]; then executable=harnest.exe; fi
          compiler_version=$(python -c "from pathlib import Path; print(next(Path('threadify-agent/runtime/vendor').glob('*.whl')).name.split('-')[1])")
          (cd .agent-compiler && go build -tags harnest_release -ldflags="-X main.version=$compiler_version" -o "$RUNNER_TEMP/agent-tools/$executable" ./cmd/harnest)
          echo "$RUNNER_TEMP/agent-tools" >> "$GITHUB_PATH"
      - name: Build portable runtime and compiled agent
        run: |
          python threadify-agent/runtime/test_prune.py
          python threadify-agent/runtime/build.py --output agent-output
      - uses: actions/upload-artifact@v7
        with:
          name: agent-runtime-${{ matrix.target }}
          path: agent-output
          if-no-files-found: error
          compression-level: 0
  validate:
    needs: [valkey, dashboard, agent-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      browser-auth-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: threadify_auth_test
          POSTGRES_PASSWORD: threadify_auth_test
          POSTGRES_DB: threadify_auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U threadify_auth_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: threadify-go
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: valkey-*
          path: threadify-go/bundle
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: engine-dashboard
          path: threadify-go/internal/dashboard/dist
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-runtime-*
          path: agent-artifacts
      - name: Verify and stage agent release inputs
        run: python3 .github/scripts/stage-engine-agent.py --input agent-artifacts
        working-directory: .
      - run: chmod 755 bundle/*/valkey-server
      - uses: ./.github/actions/setup-engine-go
      - name: Test engine release versioning
        run: |
          python3 ../.github/scripts/test_engine_version.py
          python3 ../.github/scripts/test_stage_engine_agent.py
      - name: Test binary installer
        run: |
          sh -n ../install.sh
          python3 ../.github/scripts/test_engine_installer.py
      - name: Test shared module
        env:
          THREADIFY_AUTH_TEST_DATABASE_URL: postgres://threadify_auth_test:threadify_auth_test@127.0.0.1:5432/threadify_auth_test?sslmode=disable
        run: go test ./...
        working-directory: threadify-go/shared
      - name: Test engine and managed persistence
        env:
          THREADIFY_TEST_VALKEY_BINARY: ${{ github.workspace }}/threadify-go/bundle/linux_amd64/valkey-server
          THREADIFY_TEST_AGENT_ARCHIVE: ${{ github.workspace }}/threadify-go/agent-release/runtime-linux-amd64.tar.gz
        run: go test ./...
      - uses: docker/setup-buildx-action@v4
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          workdir: threadify-go
          args: check
      - name: Build three release archives and the local Docker wrapper
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          workdir: threadify-go
          # Snapshot creates only local images; no GitHub release or registry push.
          args: release --snapshot --clean --parallelism 1
        env:
          GORELEASER_CURRENT_TAG: v0.0.0
          GORELEASER_PREVIOUS_TAG: v0.0.0
      - name: Verify binary metadata and archives
        run: |
          ./dist/threadify_linux_amd64_v1/threadify --version
          (cd dist && sha256sum --check checksums.txt)
          docker run --rm ghcr.io/threadifydev/engine:v0.0.0-amd64 --version
      - name: Verify offline runtime installation in the Docker wrapper
        run: |
          docker volume create threadify-agent-smoke
          trap 'docker volume rm threadify-agent-smoke' EXIT
          docker run --rm \
            -v threadify-agent-smoke:/data \
            -v "$PWD/agent-release:/runtime:ro" \
            ghcr.io/threadifydev/engine:v0.0.0-amd64 \
            agent install-runtime --agent-runtime-archive /runtime/runtime-linux-amd64.tar.gz
          runtime_sha=$(python3 -c 'import json; print(json.load(open("internal/agentbundle/assets/runtimes.json"))["linux/amd64"]["sha256"])')
          docker run --rm -v threadify-agent-smoke:/data \
            -v "$GITHUB_WORKSPACE/threadify-agent/runtime/smoke.py:/runtime-smoke.py:ro" \
            --entrypoint "/data/agent/$runtime_sha/python/bin/python3.12" \
            ghcr.io/threadifydev/engine:v0.0.0-amd64 \
            -I /runtime-smoke.py "/data/agent/$runtime_sha/packages"
      - name: Checkout Node SDK for live parity tests
        uses: actions/checkout@v7
        with:
          repository: ThreadifyDev/node-sdk
          path: threadify-sdk
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Node SDK dependencies
        working-directory: threadify-sdk
        run: npm ci
      - name: Test compiled binary with disposable PostgreSQL and Valkey
        working-directory: threadify-go/tests
        env:
          THREADIFY_LIVE_DIR: ''
          THREADIFY_E2E_BINARY: ${{ github.workspace }}/threadify-go/dist/threadify_linux_amd64_v1/threadify
        run: go test -v ./e2e/... -parallel=3 -count=1 -timeout=5m
