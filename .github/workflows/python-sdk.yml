name: Python SDK CI

on:
  push:
    paths:
      - 'threadify-sdk-python/**'
  pull_request:
    paths:
      - 'threadify-sdk-python/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: threadify-sdk-python
        run: pip install ruff
      - name: Run Lint
        working-directory: threadify-sdk-python
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: threadify-sdk-python/pyproject.toml
      - name: Install dependencies
        working-directory: threadify-sdk-python
        run: make install
      - name: Run Tests
        working-directory: threadify-sdk-python
        run: make test
