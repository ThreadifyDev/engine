name: Go SDK CI

on:
  push:
    paths:
      - 'threadify-sdk-go/**'
  pull_request:
    paths:
      - 'threadify-sdk-go/**'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: threadify-sdk-go/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6 
          working-directory: threadify-sdk-go

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: threadify-sdk-go/go.sum
      - name: Run Tests
        working-directory: threadify-sdk-go
        run: make test
