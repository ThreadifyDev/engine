<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadifyEngine WebSocket Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: #2563eb;
            color: white;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .status.connected {
            background: #10b981;
        }
        
        .status.disconnected {
            background: #ef4444;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        
        .panel {
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .panel-header {
            background: #f9fafb;
            padding: 12px 16px;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            font-size: 14px;
        }
        
        .panel-body {
            padding: 16px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        
        textarea {
            font-family: 'Courier New', monospace;
            min-height: 120px;
            resize: vertical;
        }
        
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        
        button:hover {
            background: #1d4ed8;
        }
        
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        button.secondary {
            background: #6b7280;
        }
        
        button.secondary:hover {
            background: #4b5563;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        button.danger:hover {
            background: #dc2626;
        }
        
        .log {
            background: #1f2937;
            color: #f3f4f6;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 400px;
            overflow-y: auto;
            border-radius: 4px;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
        }
        
        .log-entry.sent {
            color: #60a5fa;
        }
        
        .log-entry.received {
            color: #34d399;
        }
        
        .log-entry.error {
            color: #f87171;
        }
        
        .log-entry .timestamp {
            color: #9ca3af;
            margin-right: 8px;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ThreadifyEngine WebSocket Test Client</h1>
            <span class="status disconnected" id="status">Disconnected</span>
        </div>
        
        <div class="content">
            <!-- Connection Panel -->
            <div class="panel">
                <div class="panel-header">Connection</div>
                <div class="panel-body">
                    <div class="form-group">
                        <label>WebSocket URL</label>
                        <input type="text" id="wsUrl" value="ws://localhost:8080/threads">
                    </div>
                    
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="text" id="apiKey" value="test-api-key-123">
                    </div>
                    
                    <div class="form-group">
                        <label>Owner ID</label>
                        <input type="text" id="ownerId" value="test-user-456">
                    </div>
                    
                    <button id="connectBtn" onclick="connect()">Connect</button>
                    <button id="disconnectBtn" class="danger" onclick="disconnect()" disabled>Disconnect</button>
                </div>
            </div>
            
            <!-- Send Message Panel -->
            <div class="panel">
                <div class="panel-header">Send Message</div>
                <div class="panel-body">
                    <div class="form-group">
                        <label>Action</label>
                        <select id="actionType" onchange="updateMessageTemplate()">
                            <option value="connect">Connect</option>
                            <option value="startThread">Start Thread</option>
                            <option value="recordThreadEvent">Record Thread Event</option>
                            <option value="closeConnection">Close Connection</option>
                            <option value="custom">Custom JSON</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Message JSON</label>
                        <textarea id="messageJson"></textarea>
                    </div>
                    
                    <button onclick="sendMessage()" id="sendBtn" disabled>Send Message</button>
                    
                    <div class="quick-actions">
                        <button class="secondary" onclick="quickStartThread()">Quick: Start Thread</button>
                        <button class="secondary" onclick="quickRecordEvent()">Quick: Record Event</button>
                    </div>
                </div>
            </div>
            
            <!-- Message Log Panel (Full Width) -->
            <div class="panel" style="grid-column: 1 / -1;">
                <div class="panel-header">
                    Message Log
                    <button class="secondary" style="float: right; width: auto; margin: -4px 0; padding: 4px 12px;" onclick="clearLog()">Clear</button>
                </div>
                <div class="panel-body">
                    <div class="log" id="log"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let lastThreadId = null;
        
        const templates = {
            connect: {
                action: "connect",
                apiKey: "test-api-key-123",
                ownerId: "test-user-456",
                subscribedEvents: ["onSuccess", "onError", "onViolation", "onStepProgress"]
            },
            startThread: {
                action: "startThread",
                contractId: "contract-789",
                metadata: {
                    description: "Test thread",
                    priority: "high"
                }
            },
            recordThreadEvent: {
                action: "recordThreadEvent",
                threadId: "replace-with-actual-threadId",
                startedAt: new Date().toISOString(),
                status: "started",
                context: {
                    step: "step1",
                    data: "test"
                }
            },
            closeConnection: {
                action: "closeConnection"
            }
        };
        
        function updateMessageTemplate() {
            const actionType = document.getElementById('actionType').value;
            if (actionType === 'custom') {
                document.getElementById('messageJson').value = '{\n  "action": ""\n}';
            } else {
                const template = templates[actionType];
                document.getElementById('messageJson').value = JSON.stringify(template, null, 2);
            }
        }
        
        function connect() {
            const url = document.getElementById('wsUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const ownerId = document.getElementById('ownerId').value;
            
            log('Connecting to ' + url + '...', 'info');
            
            ws = new WebSocket(url);
            
            ws.onopen = () => {
                log('WebSocket connected', 'info');
                updateStatus(true);
                
                // Auto-send connect message
                const connectMsg = {
                    action: "connect",
                    apiKey: apiKey,
                    ownerId: ownerId,
                    subscribedEvents: ["onSuccess", "onError", "onViolation", "onStepProgress"]
                };
                ws.send(JSON.stringify(connectMsg));
                log('SENT: ' + JSON.stringify(connectMsg, null, 2), 'sent');
            };
            
            ws.onmessage = (event) => {
                log('RECEIVED: ' + event.data, 'received');
                try {
                    const data = JSON.parse(event.data);
                    if (data.threadId) {
                        lastThreadId = data.threadId;
                        log('Saved threadId: ' + lastThreadId, 'info');
                    }
                } catch (e) {}
            };
            
            ws.onerror = (error) => {
                log('WebSocket error: ' + error, 'error');
            };
            
            ws.onclose = () => {
                log('WebSocket disconnected', 'info');
                updateStatus(false);
            };
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }
            
            const messageJson = document.getElementById('messageJson').value;
            try {
                const message = JSON.parse(messageJson);
                ws.send(messageJson);
                log('SENT: ' + JSON.stringify(message, null, 2), 'sent');
            } catch (e) {
                log('Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function quickStartThread() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }
            
            const msg = {
                action: "startThread",
                contractId: "quick-contract-" + Date.now()
            };
            ws.send(JSON.stringify(msg));
            log('SENT: ' + JSON.stringify(msg, null, 2), 'sent');
        }
        
        function quickRecordEvent() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }
            
            if (!lastThreadId) {
                log('No threadId available. Start a thread first!', 'error');
                return;
            }
            
            const msg = {
                action: "recordThreadEvent",
                threadId: lastThreadId,
                status: "completed",
                finishedAt: new Date().toISOString(),
                context: {
                    result: "success"
                }
            };
            ws.send(JSON.stringify(msg));
            log('SENT: ' + JSON.stringify(msg, null, 2), 'sent');
        }
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = '<span class="timestamp">[' + timestamp + ']</span>' + message;
            
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const sendBtn = document.getElementById('sendBtn');
            
            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
            }
        }
        
        // Initialize
        updateMessageTemplate();
    </script>
</body>
</html>
