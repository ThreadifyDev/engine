# GraphQL Schema for Threadify Engine

type StepStateInfo {
  threadId: String!
  stepName: String!
  idempotencyKey: String!
  status: String!
  retryCount: Int!
  firstSeenAt: String!
  lastUpdatedAt: String!
  latestStepID: String!
  previousStep: String
  # Cryptographic verification (lazy-loaded, only computed when requested)
  verified: Boolean
  verificationError: String
  # Step execution history
  history(limit: Int = 100, offset: Int = 0, startAt: String, endAt: String, activityType: String, actor: String): [StepHistory!]!
}

type StepHistory {
  attempt: Int!
  timestamp: String!
  status: String!
  context: String!
  duration: Int!
  error: String
}

type Thread {
  id: ID!
  contractId: String
  contractVersion: Int
  contractName: String
  ownerId: String!
  companyId: String!
  status: String!
  # HMAC hash of the last activity event in the thread's hash chain (for cryptographic integrity verification)
  lastHash: String
  refs: JSON
  startedAt: String
  completedAt: String
  error: String
  # Get steps for this thread, optionally filtered by stepName/idempotencyKey/status
  steps(stepName: String, idempotencyKey: String, status: String): [StepStateInfo!]!
  # Get validation results for this thread
  validationResults(options: ValidationQueryOptions): [ValidationResultInfo!]!
  # Get thread chain starting from this thread, following linkedThread relationships
  threadChain(maxDepth: Int = 3): [Thread!]!
  # Hash chain integrity verification (lazy-loaded, only computed when requested)
  hashChainVerified: Boolean
  hashChainStatus: HashChainStatus
}

type HashChainStatus {
  verified: Boolean!
  lastVerifiedAt: String!
  totalEvents: Int!
  brokenAt: String
  error: String
}

type ContractGraph {
  graph: Graph!
  transitions: [Transition!]
  validation: Validation
  parties: [String!]
  notificationConfig: NotificationConfig
}

type Graph {
  nodes: [GraphNode!]!
  entryPoints: [String!]!
  terminalSteps: [String!]!
}

type GraphNode {
  id: String!
  owner: String
  type: String!
  mode: String
  required: Boolean!
  next: [String!]
  steps: [String!]
  timeout: String
  maxDuration: String
  businessContext: JSON
  parentGroup: String
}

type Transition {
  from: String!
  to: [String!]!
  canRetry: Boolean!
  maxRetries: Int!
}

type Validation {
  maxDuration: String
  allowMultipleTerminals: Boolean!
  multipleTerminalsSeverity: String
}

type NotificationConfig {
  defaultScope: String
  roleDefaults: JSON
}

type Query {
  # Get a thread by ID with cache-aside pattern
  thread(id: ID!): Thread
  
  # General thread search with flexible filtering (company-scoped by JWT)
  threads(
    actor: String
    contractName: String
    contractVersion: Int
    status: String
    startedAfter: String
    startedBefore: String
    completedAfter: String
    completedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): [Thread!]!
  
  # Contract-specific thread queries (optimized for contract monitoring)
  threadsByContract(
    contractName: String!
    contractVersion: Int
    actor: String
    status: String
    startedAfter: String
    startedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): [Thread!]!
  
  # Find threads by reference key-value pair with filtering and pagination
  threadsByRef(
    refKey: String!
    refValue: String!
    status: String
    startedAfter: String
    startedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): [Thread!]!
  
  # Get thread chain starting from root, following linkedThread relationships
  threadChain(rootId: ID!, maxDepth: Int = 3): [Thread!]!
  
  # Get contract graph by name and version (version defaults to latest if not provided)
  contractGraph(name: String!, version: Int): ContractGraph!
  # Get step history by stepName:idempKey or stepName
  stepHistory(
    threadId: String!
    stepName: String!
    idempotencyKey: String
    limit: Int = 100
    offset: Int = 0
    startAt: String
    endAt: String
    activityType: String
    actor: String
  ): [StepHistory!]!
  # Get validation results for a specific step
  validationResults(threadId: String!, stepName: String!, idempotencyKey: String!): [ValidationResultInfo!]!
}

scalar JSON

type ValidationResultInfo {
  validationId: String!
  threadId: String!
  stepId: String!
  stepName: String!
  idempotencyKey: String!
  timestamp: String!
  validations: [ValidationIssue!]!
  overallStatus: String!
  hasCriticalViolation: Boolean!
  criticalCount: Int!
  warningCount: Int!
  minorCount: Int!
  infoCount: Int!
  totalValidations: Int!
}

type ValidationIssue {
  type: String!
  message: String!
  field: String
  expected: String
  actual: String
  rule: String
}

input ValidationQueryOptions {
  threadId: String
  stepId: String
  stepName: String
  idempotencyKey: String
  validationType: String
  limit: Int
  offset: Int
}
