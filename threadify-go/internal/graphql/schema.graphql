# GraphQL Schema for Threadify Engine
#
# Query Complexity Limit: 1000 points
# - Each field costs 1 point
# - List items multiply by their count
# - Nested fields multiply by parent list size
# - Example: threads(limit: 10) { steps { stepName } } = ~1100 points (may be rejected)
# - Keep queries simple and use pagination to stay within limits

type StepStateInfo {
  threadId: String!
  stepName: String!
  idempotencyKey: String!
  status: String!
  retryCount: Int!
  firstSeenAt: String!
  lastUpdatedAt: String!
  startedAt: String
  finishedAt: String
  latestStepID: String!
  previousStep: String
  # Latest data from most recent history entry
  actor: String
  actorService: String
  latestContext: String
  # Hash chain fields for cryptographic integrity
  hash: String
  prevHash: String
  # Cryptographic verification (lazy-loaded, only computed when requested)
  verified: Boolean
  verificationError: String
  # Step execution history (max limit: 1000)
  history(limit: Int = 100, offset: Int = 0, startAt: String, endAt: String, activityType: String, actor: String): [StepHistory!]!
  # Sub-steps for this step (granular operations within the step)
  subSteps: [SubStep!]!
}

type StepHistory {
  attempt: Int!
  timestamp: String!
  status: String!
  context: String!
  error: String
  duration: Int!
  startedAt: String
  finishedAt: String
  metadata: String
  actor: String!
  actorService: String!
  companyId: String!
  companyName: String!
  # Hash chain for cryptographic integrity verification
  hash: String
  prevHash: String
}

type SubStep {
  id: ID!
  threadId: String!
  stepId: String!
  name: String!
  status: String!
  payload: JSON
  recordedAt: String!
  createdAt: String!
}

type Thread {
  id: ID!
  label: String
  contractId: String
  contractVersion: Int
  contractName: String
  ownerId: String!
  companyId: String!
  status: String!
  createdBy: String
  # HMAC hash of the last activity event in the thread's hash chain (for cryptographic integrity verification)
  lastHash: String
  refs: JSON
  startedAt: String
  completedAt: String
  error: String
  # Get steps for this thread, optionally filtered by stepName/idempotencyKey/status (max: 100 steps)
  steps(stepName: String, idempotencyKey: String, status: String): [StepStateInfo!]!
  # Get validation results for this thread (max limit: 100)
  validationResults(options: ValidationQueryOptions): [ValidationResultInfo!]!
  # Get notification summary counts (lightweight - load this first)
  notificationSummary: NotificationSummary!
  # Get notifications for this thread with full context (execution, validation, thread events)
  notifications(options: ThreadNotificationQueryOptions): [ThreadNotification!]!
  # Get thread chain starting from this thread, following linkedThread relationships
  threadChain(maxDepth: Int = 3): [Thread!]!
  # Hash chain integrity verification (lazy-loaded, only computed when requested)
  hashChainVerified: Boolean
  hashChainStatus: HashChainStatus
}

# Wrapper type for paginated thread results
type ThreadConnection {
  threads: [Thread!]!
  totalCount: Int!
}

type HashChainStatus {
  verified: Boolean!
  lastVerifiedAt: String!
  totalEvents: Int!
  brokenAt: String
  error: String
}

type ContractGraph {
  graph: Graph!
  transitions: [Transition!]
  validation: Validation
  parties: [String!]
  notificationConfig: NotificationConfig
}

type Graph {
  nodes: [GraphNode!]!
  entryPoints: [String!]!
  terminalSteps: [String!]!
}

type GraphNode {
  id: String!
  owner: String
  type: String!
  mode: String
  required: Boolean!
  next: [String!]
  steps: [String!]
  timeout: String
  maxDuration: String
  businessContext: JSON
  parentGroup: String
}

type Transition {
  from: String!
  to: [String!]!
  timeout: String
  maxRetries: Int!
}

type Validation {
  maxDuration: String
  allowMultipleTerminals: Boolean!
  multipleTerminalsSeverity: String
}

type NotificationConfig {
  defaultScope: String
  roleDefaults: JSON
}

type Query {
  # Get a thread by ID with cache-aside pattern
  thread(id: ID!): Thread
  
  # General thread search with flexible filtering (company-scoped by JWT, max limit: 100)
  threads(
    actor: String
    contractName: String
    contractVersion: Int
    status: String
    startedAfter: String
    startedBefore: String
    completedAfter: String
    completedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): ThreadConnection!
  
  # Contract-specific thread queries (optimized for contract monitoring, max limit: 100)
  threadsByContract(
    contractName: String!
    contractVersion: Int
    actor: String
    status: String
    startedAfter: String
    startedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): ThreadConnection!
  
  # Find threads by reference key-value pair with filtering and pagination (max limit: 100)
  # If refKey is omitted, searches across all ref keys for the given refValue
  threadsByRef(
    refKey: String
    refValue: String!
    status: String
    startedAfter: String
    startedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): ThreadConnection!

  # Get thread history for a specific entity profile
  entityProfileHistory(
    profileID: ID!
    status: String
    startedAfter: String
    startedBefore: String
    limit: Int = 50
    offset: Int = 0
  ): ThreadConnection!
  
  # Get thread chain starting from root, following linkedThread relationships
  threadChain(rootId: ID!, maxDepth: Int = 3): [Thread!]!
  
  # Get contract graph by name and version (version defaults to latest if not provided)
  contractGraph(name: String!, version: Int): ContractGraph!
  # Get step history by stepName:idempKey or stepName (max limit: 1000)
  stepHistory(
    threadId: String!
    stepName: String!
    idempotencyKey: String
    limit: Int = 100
    offset: Int = 0
    startAt: String
    endAt: String
    activityType: String
    actor: String
  ): [StepHistory!]!
  # Get validation results for a specific step
  validationResults(threadId: String!, stepName: String!, idempotencyKey: String!): [ValidationResultInfo!]!
  
  # Resolve actor names from IDs (users or service accounts)
  resolveActors(ids: [String!]!): [ActorInfo!]!
  
  # Verify hash chain integrity for a thread (separate from thread query for performance)
  verifyThreadIntegrity(threadId: String!): HashChainStatus!
  
  # Verify hash integrity for a single step
  verifyStepIntegrity(threadId: String!, stepName: String!, idempotencyKey: String!): StepIntegrityStatus!

  # Verify if the company has sufficient credits (amount: millicents, meter: meter name)
  # If amount/meter are omitted, performs a basic active account check.
  checkCredits(meter: String, amount: Int): Boolean!

  # Retrieve an entity profile and its intelligence metrics
  entityProfile(id: String, refKey: String, type: String): EntityProfile

  # Retrieve all configured entity profile types for the company
  entityProfileTypes: [EntityProfileType!]!

  # List entity profiles for a given profile type (by profile type name). Supports
  # case-insensitive search across ref_key and name plus pagination.
  entityProfilesByType(
    type: String!
    search: String
    limit: Int
    offset: Int
  ): EntityProfileConnection!
}

type EntityProfileConnection {
  items: [EntityProfile!]!
  totalCount: Int!
  profileType: EntityProfileType
}

type Mutation {
  # Record LLM token usage for the authenticated company
  recordLLMUsage(tokens: Int!): Boolean!
}

type StepIntegrityStatus {
  verified: Boolean!
  hash: String
  prevHash: String
  error: String
}

scalar JSON

type ValidationResultInfo {
  validationId: String!
  threadId: String!
  stepId: String!
  stepName: String!
  idempotencyKey: String!
  timestamp: String!
  validations: [ValidationIssue!]!
  overallStatus: String!
  hasCriticalViolation: Boolean!
  criticalCount: Int!
  warningCount: Int!
  minorCount: Int!
  infoCount: Int!
  totalValidations: Int!
}

type ValidationIssue {
  type: String!
  message: String!
  field: String
  expected: String
  actual: String
  rule: String
}

input ValidationQueryOptions {
  threadId: String
  stepId: String
  stepName: String
  idempotencyKey: String
  validationType: String
  limit: Int
  offset: Int
}

type ThreadNotification {
  notificationId: String!
  threadId: String!
  stepId: String!
  stepName: String!
  idempotencyKey: String
  source: String!
  notificationType: String!
  stepStatus: String
  validationStatus: String
  violationType: String
  severity: String
  message: String!
  details: JSON
  timestamp: String!
}

input ThreadNotificationQueryOptions {
  threadId: String
  stepId: String
  stepName: String
  source: String
  notificationType: String
  severity: [String!]
  limit: Int
  offset: Int
}

type NotificationSummary {
  totalNotifications: Int!
  criticalCount: Int!
  warningCount: Int!
  majorCount: Int!
  minorCount: Int!
  infoCount: Int!
  executionCount: Int!
  validationCount: Int!
  hasCritical: Boolean!
  hasWarnings: Boolean!
}

type ActorInfo {
  id: String!
  name: String!
  type: String!
  companyName: String
}

type EntityProfileMetrics {
  entityProfileId: String!
  totalDeliveries: Int!
  completedSuccessfully: Int!
  validationViolations: Int!
  deliveryHealthScore: Float
  prevDeliveryHealthScore: Float
  healthTrendSlope: Float
  averageDeliveryTimeMs: Int
  lastCalculatedAt: String
}

type EntityProfile {
  id: String!
  refKey: String!
  companyId: String!
  profileTypeId: String!
  profileType: EntityProfileType
  name: String
  createdAt: String!
  lastActiveAt: String!
  metrics: EntityProfileMetrics
}

type EntityProfileType {
  id: String!
  companyId: String!
  name: String!
  type: [String!]!
  description: String
  createdAt: String!
  updatedAt: String!
}
