# GraphQL Schema for Threadify Engine

type StepStateInfo {
  threadId: String!
  stepName: String!
  idempotencyKey: String!
  status: String!
  retryCount: Int!
  firstSeenAt: String!
  lastUpdatedAt: String!
  latestStepID: String!
  previousStep: String
  history(limit: Int = 100, offset: Int = 0, startAt: String, endAt: String, activityType: String, actor: String): [StepHistory!]!
}

type StepHistory {
  attempt: Int!
  timestamp: String!
  status: String!
  context: String!
  duration: Int!
  error: String
}

type Thread {
  id: ID!
  contractId: String
  contractVersion: Int
  contractName: String
  ownerId: String!
  companyId: String!
  status: String!
  lastHash: String
  refs: JSON
  startedAt: String
  completedAt: String
  error: String
  # Get steps for this thread, optionally filtered by stepName/idempotencyKey
  steps(stepName: String, idempotencyKey: String): [StepStateInfo!]!
  # Get validation results for this thread
  validationResults(options: ValidationQueryOptions): [ValidationResultInfo!]!
}

type Query {
  # Get a thread by ID with cache-aside pattern
  thread(id: ID!): Thread
  # Find threads by reference key-value pair
  threadsByRef(refKey: String!, refValue: String!): [Thread!]!
  # Get step history by stepName:idempKey or stepName
  stepHistory(
    threadId: String!
    stepName: String!
    idempotencyKey: String
    limit: Int = 100
    offset: Int = 0
    startAt: String
    endAt: String
    activityType: String
    actor: String
  ): [StepHistory!]!
  # Get validation results for a specific step
  validationResults(threadId: String!, stepName: String!, idempotencyKey: String!): [ValidationResultInfo!]!
}

scalar JSON

type ValidationResultInfo {
  validationId: String!
  threadId: String!
  stepId: String!
  stepName: String!
  idempotencyKey: String!
  timestamp: String!
  validations: [ValidationIssue!]!
  overallStatus: String!
  hasCriticalViolation: Boolean!
  criticalCount: Int!
  warningCount: Int!
  minorCount: Int!
  infoCount: Int!
  totalValidations: Int!
}

type ValidationIssue {
  type: String!
  message: String!
  field: String
  expected: String
  actual: String
  rule: String
}

input ValidationQueryOptions {
  threadId: String
  stepId: String
  stepName: String
  idempotencyKey: String
  validationType: String
  limit: Int
  offset: Int
}
