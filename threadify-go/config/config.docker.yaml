server:
  port: 8081
  host: 0.0.0.0

postgres:
  url: "postgres://td_engine:tdtdtd@postgres:5432/threadify?sslmode=disable"
  max_connections: 25
  max_idle_connections: 5

redis:
  host: valkey
  port: 6379
  password: threadify_secure_password
  db: 0
  pool_size: 8

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-min-32-chars
  issuer: threadify-engine
  audience: threadify-users
  realm: Threadify API
  expiration_hours: 24

queue:
  ttl_seconds: 7776000

thread_activities:
  batch_size: 100
  batch_timeout_ms: 1000

# Rate limiting configuration
rate_limit:
  requests_per_second: 5000
  burst_size: 10000
  cleanup_interval_hours: 1

cache:
  contract_ttl_hours: 24
  thread_ttl_hours: 72
  step_event_ttl_hours: 168
  session_ttl_minutes: 30

logging:
  level: info

# Archiver service configuration
archiver:
  enabled: true
  
  buffers:
    thread_step_state:
      size: 100
      flush_interval_seconds: 10
    thread_metadata:
      size: 50
      flush_interval_seconds: 5
    thread_access:
      size: 50
      flush_interval_seconds: 5
    thread_validations:
      size: 100
      flush_interval_seconds: 51
    thread_activities:
      size: 100
      flush_interval_seconds: 5
  
  retry:
    max_attempts: 6
    initial_backoff_seconds: 1
    max_backoff_seconds: 16
  
  streams:
    consumer_group: "archiver-group"
    block_timeout_seconds: 5
    batch_size: 100
