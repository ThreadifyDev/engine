global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Engine metrics
  - job_name: 'threadify-engine'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'engine'
          environment: 'development'

  # Web API metrics
  - job_name: 'threadify-web-api'
    static_configs:
      - targets: ['host.docker.internal:3001']
        labels:
          service: 'web-api'
          environment: 'development'

  # Archiver metrics
  - job_name: 'threadify-archiver'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'archiver'
          environment: 'development'
