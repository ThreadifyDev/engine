billing:
  provider: stripe
  webhook_secret: ""
  secret_key: ""
  success_url: "http://localhost:3000/u/settings?tab=billing"
  cancel_url: "http://localhost:3000/u/settings?tab=billing"

subscription:
  signup_credits_millicents: 100000 # $1.00 default seed on signup (0 falls back to service default)
  credit:
    ingress_cost_millicents: 3  # $0.00003 per thread create (3 millicents) - $15 = 500K threads
    egress_cost_millicents: 3      # $0.00003 per MB (3 millicents) - $15 = 500K MB
    seat_cost_millicents: 100000               # $1.00 per seat (100,000 millicents)
    contract_cost_millicents: 100000             # $1.00 per contract (100,000 millicents)
    llm_token_cost_millicents: 100             # $0.001 per token (100 millicents, set >0 to bill MCP LLM usage)
    rate_limit_tps: 60000
    payload_limit_bytes: 1048576 # 1MB
