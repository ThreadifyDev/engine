server:
  port: 8081
  host: 0.0.0.0

postgres:
  url: "postgres://td_engine:tdtdtd@localhost:5434/threadify?sslmode=disable"
  host: localhost
  port: 5434
  user: td_engine
  password: tdtdtd
  name: threadify
  max_connections: 25
  max_idle_connections: 5

redis:
  host: localhost
  port: 6379
  password: threadify_secure_queue_password
  db: 0
  pool_size: 200  # Increased for archiver with many concurrent streams
  min_idle_conns: 10              # Minimum idle connections to keep ready
  max_idle_conns: 100             # Maximum idle connections to maintain
  max_retries: 1                  # Fail fast on errors
  dial_timeout_ms: 2000           # Connection establishment timeout (2s)
  read_timeout_ms: 500            # Read operation timeout (500ms)
  write_timeout_ms: 500           # Write operation timeout (500ms) - can be increased for high goroutine concurrency
  pool_timeout_ms: 5000           # Wait time for connection from pool (5s)
  conn_max_idle_time_ms: 300000   # How long idle connections stay alive (5 minutes)

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-min-32-chars
  issuer: threadify-engine
  audience: threadify-users
  realm: Threadify API
  expiration_hours: 24

queue:
  ttl_seconds: 7776000

thread_activities:
  batch_size: 100
  batch_timeout_ms: 1000

# Rate limiting configuration
rate_limit:
  enabled: true
  cleanup_interval: "1h"
  
  # Per-IP rate limiting (in-memory, per-pod)
  per_ip:
    enabled: false
    requests_per_minute: 60
    burst: 10
  
  # Per-user rate limiting (Redis, global across pods)
  per_user:
    enabled: true
    requests_per_minute: 1000
    burst: 50
    window_seconds: 60
    cache_size: 50000           # Max users cached per pod (for 50k+ users)
    cache_ttl_seconds: 2        # Cache decisions for 2 seconds
    redis_timeout_ms: 3         # Redis timeout in milliseconds (fail-open if exceeded)

# WebSocket configuration
websocket:
  handshake_timeout_seconds: 10
  read_buffer_size: 1024
  write_buffer_size: 1024
  max_in_flight_max: 100      # Maximum allowed maxInFlight per client
  max_in_flight_default: 10   # Default maxInFlight if not specified

# Bot scanner configuration
bot_scanner:
  enabled: true
  block_known_bots: true       # Block requests from known bot user-agents
  log_suspicious: false        # Log suspicious activity (set false to reduce log clutter)
  cleanup_interval_minutes: 30 # How often to clean up old tracking data

cache:
  contract_ttl_ms: 18000000    # Contract data expires after 5 hours (hot cache, PostgreSQL fallback)
  thread_ttl_ms: 18000000      # Thread data expires after 5 hours (hot cache, PostgreSQL fallback)
  step_event_ttl_ms: 18000000  # Step events expire after 5 hours (hot cache, PostgreSQL fallback)
  session_ttl_ms: 1800000      # WebSocket session expires after 30 minutes (short-lived, no persistence)

# Invitation configuration
invitations:
  default_permissions: "read,write"    # Default permissions for invitations
  default_expiry: "24h"               # Default expiry for invitation tokens
  max_expiry: "7d"                    # Maximum allowed expiry
  # allowed_roles removed - roles now validated dynamically against contract parties

# Thread access batching configuration
thread_access:
  batch_size: 25              # Flush when buffer reaches this size
  batch_timeout_ms: 50        # Flush every 50ms (hybrid: whichever comes first)
  buffer_size: 100            # Channel buffer size for async writes

logging:
  level: info

# Security configuration
security:
  # Hash chain secrets for HMAC-based activity log integrity verification
  # Generate with: openssl rand -hex 32
  # Keep all versions forever to verify old chains after key rotation
  hash_chain_secrets:
    v1: "demo-secret-key-replace-in-production-with-64-char-hex-string"
  hash_chain_current_version: "v1"

# Timeout configuration for context operations
timeouts:
  default_operation_seconds: 30      # Default timeout for most operations
  validation_seconds: 60             # Timeout for async validations
  database_query_seconds: 10         # Timeout for database queries
  redis_operation_seconds: 5         # Timeout for Redis operations
  nats_publish_seconds: 5            # Timeout for NATS publishing
  archival_operation_seconds: 30     # Timeout for archival operations

# NATS configuration for notification delivery
nats:
  url: "nats://localhost:4222"
  cluster_id: "threadify-cluster"
  client_id: "threadify-server"
  stream_name: "NOTIFICATIONS"
  retention_hours: 48
  max_age_hours: 168  # 7 days
  ack_wait_seconds: 30
  
  # Consumer configuration
  consumer_ack_wait_seconds: 30
  consumer_max_deliver: 3
  
  # Archiver configuration
  archiver_max_deliver: 10
  archiver_ack_wait_seconds: 30
  
  # Stream retention
  notifications_retention_days: 3
  dlq_retention_days: 7

# Notification system configuration
notification_system:
  # System-defined notification scopes
  scopes:
    owner:
      description: "Full access to all notifications"
      permissions:
        - all_violations
        - all_completions
        - thread_lifecycle
    
    participant:
      description: "Normal access for active parties"
      permissions:
        - own_step_violations
        - critical_violations
        - completions
        - thread_lifecycle
    
    observer:
      description: "Read-only access for monitoring"
      permissions:
        - completions
        - thread_lifecycle
  
  # Default scope if not specified
  default_scope: participant

# Archiver service configuration
archiver:
  enabled: true
  
  # Buffer settings per queue type
  buffers:
    thread_step_state:
      size: 100
      flush_interval_ms: 10000
    thread_metadata:
      size: 50
      flush_interval_ms: 5000
    thread_access:
      size: 50
      flush_interval_ms: 5000
    thread_validations:
      size: 100
      flush_interval_ms: 5000
  
  # Partitioned activity streams (global streams with partitioning)
  activity_streams:
    enabled: true
    num_partitions: 10
    workers_per_instance: 3
    buffer_size: 200
    flush_interval_ms: 5000
    max_buffer_size: 1000
    trim_enabled: true
    trim_maxlen: 10000
  
  # Retry configuration for failed writes
  retry:
    max_attempts: 6
    initial_backoff_ms: 1000
    max_backoff_ms: 16000
  
  # Valkey stream configuration
  streams:
    consumer_group: "archiver-group"
    block_timeout_ms: 5000
    batch_size: 100
    step_state_flush_interval_ms: 5000  # Flush interval for step state archival (default: 5 seconds)

# Web API service configuration
web_api:
  enabled: true
  port: 3001
  host: 0.0.0.0
  cors_origins: "http://localhost:3000"
  
  # Email service (Plunk)
  email:
    plunk_api_key: "sk_b2383fde9b0f52295c5410166454519f4db28e48561bd419"
    plunk_from_email: "noreply@threadify.com"
  
  # Threadify Engine integration
  threadify_engine:
    url: "http://localhost:8081"
    graphql_url: "http://localhost:8081/graphql"
  
  # API Key settings
  api_key_ttl_hours: 8760  # 365 days
  
  # Rate limiting
  rate_limit:
    requests: 100
    window_minutes: 1
