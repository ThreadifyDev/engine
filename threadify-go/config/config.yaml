server:
  port: 8081
  host: 0.0.0.0

postgres:
  url: "postgres://td_engine:tdtdtd@localhost:5434/threadify?sslmode=disable"
  max_connections: 25
  max_idle_connections: 5

redis:
  host: localhost
  port: 6379
  password: threadify_secure_password
  db: 0
  pool_size: 8

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-min-32-chars
  issuer: threadify-engine
  audience: threadify-users
  realm: Threadify API
  expiration_hours: 24

queue:
  ttl_seconds: 7776000

step_events:
  batch_size: 100
  batch_timeout_ms: 1000

# Rate limiting configuration
rate_limit:
  requests_per_second: 5000     # Reduced from 100 to test
  burst_size: 10000             # Reduced from 200 to test
  cleanup_interval_hours: 1  # Cleanup interval for expired tokens
cache:
  contract_ttl_hours: 24    # Contract data expires after 24 hours
  thread_ttl_hours: 72      # Thread data expires after 72 hours
  step_event_ttl_hours: 168  # Step events expire after 7 days
  session_ttl_minutes: 30   # WebSocket session expires after 30 minutes

logging:
  level: info
