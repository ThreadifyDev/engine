server:
  port: 8081
  host: 0.0.0.0

postgres:
  url: "postgres://td_engine:tdtdtd@localhost:63781/threadify?sslmode=disable"
  host: localhost
  port: 63781
  user: td_engine
  password: tdtdtd
  name: threadify
  max_connections: 25
  max_idle_connections: 5

redis:
  host: localhost
  port: 6379
  password: thread0fy_server
  db: 0
  pool_size: 200  # Increased for archiver with many concurrent streams

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-min-32-chars
  issuer: threadify-engine
  audience: threadify-users
  realm: Threadify API
  expiration_hours: 24

queue:
  ttl_seconds: 7776000

thread_activities:
  batch_size: 100
  batch_timeout_ms: 1000

# Rate limiting configuration
rate_limit:
  requests_per_second: 5000     # Reduced from 100 to test
  burst_size: 10000             # Reduced from 200 to test
  cleanup_interval_hours: 1  # Cleanup interval for expired tokens
cache:
  contract_ttl_hours: 24    # Contract data expires after 24 hours
  thread_ttl_hours: 72      # Thread data expires after 72 hours
  step_event_ttl_hours: 168  # Step events expire after 7 days
  session_ttl_minutes: 30   # WebSocket session expires after 30 minutes

# Invitation configuration
invitations:
  default_permissions: "read,write"    # Default permissions for invitations
  default_expiry: "24h"               # Default expiry for invitation tokens
  max_expiry: "7d"                    # Maximum allowed expiry
  # allowed_roles removed - roles now validated dynamically against contract parties

logging:
  level: info

# Security configuration
security:
  # Hash chain secrets for HMAC-based activity log integrity verification
  # Generate with: openssl rand -hex 32
  # Keep all versions forever to verify old chains after key rotation
  hash_chain_secrets:
    v1: "demo-secret-key-replace-in-production-with-64-char-hex-string"
  hash_chain_current_version: "v1"

# Timeout configuration for context operations
timeouts:
  default_operation_seconds: 30      # Default timeout for most operations
  validation_seconds: 60             # Timeout for async validations
  database_query_seconds: 10         # Timeout for database queries
  redis_operation_seconds: 5         # Timeout for Redis operations
  nats_publish_seconds: 5            # Timeout for NATS publishing
  archival_operation_seconds: 30     # Timeout for archival operations

# NATS configuration for notification delivery
nats:
  url: "nats://localhost:4222"
  cluster_id: "threadify-cluster"
  client_id: "threadify-server"
  stream_name: "NOTIFICATIONS"
  retention_hours: 48
  max_age_hours: 168  # 7 days
  ack_wait_seconds: 30

# Notification system configuration
notification_system:
  # System-defined notification scopes
  scopes:
    owner:
      description: "Full access to all notifications"
      permissions:
        - all_violations
        - all_completions
        - thread_lifecycle
    
    participant:
      description: "Normal access for active parties"
      permissions:
        - own_step_violations
        - critical_violations
        - completions
        - thread_lifecycle
    
    observer:
      description: "Read-only access for monitoring"
      permissions:
        - completions
        - thread_lifecycle
  
  # Default scope if not specified
  default_scope: participant

# Archiver service configuration
archiver:
  enabled: true
  
  # Buffer settings per queue type
  buffers:
    thread_step_state:
      size: 100
      flush_interval_ms: 10000
    thread_metadata:
      size: 50
      flush_interval_ms: 5000
    thread_access:
      size: 50
      flush_interval_ms: 5000
    thread_validations:
      size: 100
      flush_interval_ms: 5000
  
  # Partitioned activity streams (global streams with partitioning)
  activity_streams:
    enabled: true
    num_partitions: 10
    workers_per_instance: 3
    buffer_size: 200
    flush_interval_ms: 5000
    max_buffer_size: 1000
    trim_enabled: true
    trim_maxlen: 10000
  
  # Retry configuration for failed writes
  retry:
    max_attempts: 6
    initial_backoff_ms: 1000
    max_backoff_ms: 16000
  
  # Valkey stream configuration
  streams:
    consumer_group: "archiver-group"
    block_timeout_ms: 5000
    batch_size: 100
    step_state_flush_interval_ms: 5000  # Flush interval for step state archival (default: 5 seconds)
