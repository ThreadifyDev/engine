contract_name: product_delivery
version: 1
description: Complete product delivery workflow with retry limits

# Entry points - where threads can start
entry_points:
  - order_placed

# Parties involved in the workflow
parties:
  - merchant
  - payment_processor
  - warehouse_manager
  - logistics_carrier

# Steps in the workflow
steps:
  - id: order_placed
    owner: merchant
    type: managed
    timeout: 5m
    business_context:
      required:
        - order_id
        - customer_id
        - total_amount
      optional:
        - notes
        - promo_code

  - id: payment_validation
    owner: payment_processor
    type: external
    timeout: 30s
    business_context:
      required:
        - payment_method
        - amount
      optional:
        - transaction_id

  - id: payment_validated
    owner: payment_processor
    type: managed

  - id: order_cancelled
    owner: merchant
    type: managed
    business_context:
      required:
        - cancellation_reason

  - id: fulfillment_ready
    owner: warehouse_manager
    type: human_in_loop
    timeout: 2h
    business_context:
      required:
        - warehouse_location
        - items_count

  - id: shipped
    owner: logistics_carrier
    type: managed
    timeout: 24h
    business_context:
      required:
        - tracking_number
        - carrier_name
      optional:
        - estimated_delivery

  - id: delivered
    owner: logistics_carrier
    type: managed
    business_context:
      required:
        - delivery_timestamp
        - signature

  - id: delivery_failed
    owner: logistics_carrier
    type: managed
    business_context:
      required:
        - failure_reason

# Transitions define valid step flows
transitions:
  - from: order_placed
    to:
      - payment_validation
    timeout: 2m
    max_retries: 3

  - from: payment_validation
    to:
      - payment_validated
      - order_cancelled
    timeout: 30s
    max_retries: 3

  - from: payment_validated
    to:
      - fulfillment_ready
    timeout: 5m

  - from: fulfillment_ready
    to:
      - shipped
    timeout: 4h

  - from: shipped
    to:
      - delivered
      - delivery_failed
    timeout: 72h

  - from: delivery_failed
    to:
      - shipped
    timeout: 1h
    max_retries: 2

# Terminal steps - where threads can end
terminal_steps:
  - delivered
  - order_cancelled

# Validation rules
validation:
  max_duration: 72h
  allow_multiple_terminals: false
  multiple_terminals_severity: major

# Versioning rules
versioning:
  threads_lock_to_version: true

# Notification configuration
notification_config:
  # Default scope for parties (uses system default if not specified)
  default_scope: participant
  
  # Role-specific scope overrides
  role_defaults:
    merchant: owner              # Thread creator gets full access
    analytics_service: observer  # Analytics gets read-only access
