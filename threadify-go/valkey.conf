# Valkey configuration file

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication
requirepass threadify_secure_password

# Memory management
maxmemory 1024mb
maxmemory-policy allkeys-lru

# Persistence
# save 900 1
# save 300 10
# save 60 10000

# Logging
loglevel notice
logfile ""

# Clients
timeout 300
tcp-keepalive 300
maxclients 10000

# AOF configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Performance
tcp-backlog 511
databases 16
maxmemory-policy allkeys-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# I/O threading for better performance
# Increased to 8 for better throughput with replica reads
io-threads 8
io-threads-do-reads yes

# Dynamic hz for better event loop performance
hz 100
dynamic-hz yes