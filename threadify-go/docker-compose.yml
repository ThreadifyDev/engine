version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: threadify-postgres
    environment:
      POSTGRES_DB: threadify
      POSTGRES_USER: td_engine
      POSTGRES_PASSWORD: tdtdtd
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U td_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: threadify-redis
    command: redis-server --requirepass threadify_secure_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
