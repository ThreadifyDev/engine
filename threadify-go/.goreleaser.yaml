version: 2
project_name: threadify

before:
  hooks:
    - python3 scripts/check-valkey-bundle.py
    - python3 scripts/check-dashboard.py

builds:
  - id: threadify
    main: ./cmd/server
    binary: threadify
    env:
      - CGO_ENABLED=0
      - GOMAXPROCS=2
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # One architecture per OS: Apple Silicon Macs and x86-64 Linux/Windows.
    ignore:
      - {goos: darwin, goarch: amd64}
      - {goos: linux, goarch: arm64}
      - {goos: windows, goarch: arm64}
    flags: [-trimpath, -p=2]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Only reviewed self-hosting templates are shipped, never config.yaml/.env.
    files:
      - SELF_HOSTING.md
      - docs/CLI.md
      - docs/MANAGED_VALKEY.md
      - src: "bundle/{{ .Os }}_{{ .Arch }}/*"
        dst: libexec
        strip_parent: true
      - src: config/config.selfhost.yaml
        dst: config/config.yaml

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: [ghcr.io/threadifydev/engine]
    tags:
      - "{{ .Tag }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    dockerfile: Dockerfile.goreleaser
    platforms: [linux/amd64]
    extra_files:
      - bundle/linux_amd64
      - config/config.selfhost.yaml
    labels:
      org.opencontainers.image.source: https://github.com/ThreadifyDev/engine
      org.opencontainers.image.title: Threadify engine
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  github:
    owner: ThreadifyDev
    name: engine
  name_template: "Threadify engine {{ .Tag }}"
  replace_existing_artifacts: true

changelog:
  # Supplied by the workflow so SDK commits do not appear in engine notes.
  disable: true
