apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: threadify-agent
  displayName: Threadify Agent
  labels:
    owner: threadify
spec:
  enabled: true
  entrypoint: agent:root_agent
  framework:
    name: adk
    mode: managed
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 8
  scaling:
    minReplicas: 0
    maxReplicas: 3
  environment:
    THREADIFY_GRAPHQL_URL: http://127.0.0.1:8081/graphql
    THREADIFY_OTLP_ENDPOINT: http://127.0.0.1:8081/v1/traces
    THREADIFY_JWKS_AUDIENCE: authenticated
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: NO_CONTENT
    ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: "false"
