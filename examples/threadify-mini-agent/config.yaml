apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: threadify-mini-agent
  displayName: Northstar Customer Support
spec:
  enabled: true
  entrypoint: agent:root_agent
  interfaces:
    cli: true
  framework:
    name: adk
    mode: managed
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 8
  scaling:
    minReplicas: 0
    maxReplicas: 1
  environment:
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: NO_CONTENT
    ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS: "false"
