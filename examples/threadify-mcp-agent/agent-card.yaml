name: Threadify MCP Analyst
description: Investigate Threadify telemetry through its MCP read tools.
version: 0.1.0
supportedInterfaces:
  - url: http://127.0.0.1:8122
    protocolBinding: HTTP+JSON
    protocolVersion: "1.0"
capabilities:
  streaming: true
defaultInputModes:
  - text/plain
defaultOutputModes:
  - text/plain
skills:
  - id: investigate
    name: Investigate telemetry
    description: Find threads, inspect recorded steps, and explain entity delivery health.
    tags: [threadify, telemetry, investigation]
