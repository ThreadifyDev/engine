version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: threadify-grafana
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/threadify-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./threadify-go/config/grafana/provisioning:/etc/grafana/provisioning
      - ./threadify-go/config/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grafana-data:
