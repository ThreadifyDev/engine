# Valkey configuration file
# Optimized for performance with durability

# Network
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/valkey/valkey-server.pid
loglevel notice
logfile ""
databases 16

# Persistence - Combined approach
# RDB snapshots
save 900 1
# Save if 1 key changes in 15 minutes
save 300 10
# Save if 10 keys change in 5 minutes
save 60 10000
# Save if 10,000 keys change in 1 minute
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync no
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Performance optimizations
maxmemory-policy noeviction
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# I/O threading for better performance
# Increased to 8 for better throughput with replica reads
io-threads 8
io-threads-do-reads yes

# Dynamic hz for better event loop performance
hz 100
dynamic-hz yes

# Security
# Authentication enabled
requirepass threadify_secure_password
